---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bind9-debug-config
  namespace: openstack
data:
  named.conf: |
    options {
      directory "/var/cache/bind";
      listen-on { any; };
      listen-on-v6 { none; };
      allow-query { any; };
      recursion no;
      allow-new-zones yes;
      dnssec-validation no;
      allow-notify { 172.17.0.0/24; };
    };

    logging {
      channel default_log {
        stderr;
        severity dynamic;
        print-category yes;
        print-severity yes;
        print-time yes;
      };
      category default { default_log; };
      category queries { default_log; };
    };

    key "rndc-key" {
      algorithm hmac-sha256;
      secret "+zitgGHPMJmWSyUtzR2wBTUNDGAENji0rYNHb7PyFc8=";
    };

    controls {
      inet * port 953 allow { 172.17.0.0/24; } keys { "rndc-key"; };
    };
---
apiVersion: v1
kind: Pod
metadata:
  name: bind9-debug
  namespace: openstack
  labels:
    app: bind9-debug
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name": "internalapi", "namespace": "openstack"}]'
spec:
  containers:
    - name: bind9
      image: internetsystemsconsortium/bind9:9.20
      securityContext:
        runAsUser: 0
        capabilities:
          add: ["NET_BIND_SERVICE", "SYS_ADMIN", "SYS_NICE"]
        fsGroup: 53
      volumeMounts:
        - name: config
          mountPath: /etc/bind/named.conf
          subPath: named.conf
          readOnly: true
        - name: working-data
          mountPath: /var/cache/bind
          readOnly: false
      args:
        - "600"
      command:
        - sleep
  volumes:
    - name: config
      configMap:
        name: bind9-debug-config
    - name: working-data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bind9-debug
  namespace: openstack
spec:
  selector:
    app: bind9-debug
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
  type: ClusterIP
